<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sakura for You 🌸</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(to bottom, #ffe6f0, #fff5f8);
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #container {
    position: relative;
    width: 250px;
    height: 250px;
    cursor: pointer;
  }
  /* Sakura flower petals */
  .petal {
    position: absolute;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle at 30% 30%, #ffb7c5 40%, #ffa6bb 70%, #fcd1db 90%);
    border-radius: 60% 40% 50% 50% / 60% 60% 40% 40%;
    transform-origin: center;
    animation: floatPetal linear infinite;
    filter: drop-shadow(0 0 2px #ff8ca7);
  }
  @keyframes floatPetal {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(600px) rotate(360deg) scale(0.6);
      opacity: 0;
    }
  }
  /* Flower center */
  #flower-center {
    position: absolute;
    width: 70px;
    height: 70px;
    background: radial-gradient(circle at center, #ff5a87, #ff1e57);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px 3px rgba(255, 90, 135, 0.7);
    transition: box-shadow 0.3s ease;
  }
  /* Flower bloom animation */
  #container.bloom .petal {
    animation-play-state: paused;
    opacity: 1 !important;
    transition: transform 0.4s ease;
  }
  #container.bloom .petal:nth-child(1) { transform: rotate(0deg) translate(80px) rotate(0deg); }
  #container.bloom .petal:nth-child(2) { transform: rotate(45deg) translate(80px) rotate(-45deg); }
  #container.bloom .petal:nth-child(3) { transform: rotate(90deg) translate(80px) rotate(-90deg); }
  #container.bloom .petal:nth-child(4) { transform: rotate(135deg) translate(80px) rotate(-135deg); }
  #container.bloom .petal:nth-child(5) { transform: rotate(180deg) translate(80px) rotate(-180deg); }
  
  #container.bloom #flower-center {
    box-shadow: 0 0 25px 6px rgba(255, 90, 135, 0.9);
    transform: translate(-50%, -50%) scale(1.1);
  }
</style>
</head>
<body>
  <div id="container" title="Click me to bloom!">
    <div class="petal" style="top: 50%; left: 50%; animation-duration: 10s; animation-delay: 0s;"></div>
    <div class="petal" style="top: 60%; left: 55%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="petal" style="top: 45%; left: 60%; animation-duration: 11s; animation-delay: 1s;"></div>
    <div class="petal" style="top: 55%; left: 45%; animation-duration: 13s; animation-delay: 3s;"></div>
    <div class="petal" style="top: 50%; left: 40%; animation-duration: 14s; animation-delay: 4s;"></div>
    <div id="flower-center"></div>
  </div>

<script>
  const container = document.getElementById('container');

  container.addEventListener('click', () => {
    container.classList.toggle('bloom');
  });

  // Optional: reset bloom after 4 seconds
  container.addEventListener('click', () => {
    setTimeout(() => {
      container.classList.remove('bloom');
    }, 4000);
  });
</script>
</body>
</html>
